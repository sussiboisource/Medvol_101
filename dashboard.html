<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Medvol Discount &amp; Sales Dashboard</title>
<style>
  :root {
    --bg: #f7f8fa; --panel: #ffffff; --border: #e2e5ea; --text: #1c2128; --muted: #6b7280;
    --accent: #2563eb; --accent-soft: #dbeafe; --bar: #2563eb; --bar2: #93c5fd;
    --line1: #2563eb; --line2: #dc2626; --line3: #059669; --line4: #d97706; --line5: #7c3aed;
    --warn-bg: #fff7ed; --warn-border: #fdba74; --warn-text: #9a3412;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  header { padding: 20px 28px 0; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 28px; }
  .tab-btn {
    padding: 10px 18px; border: none; background: none; cursor: pointer; font-size: 14px;
    color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-panel { display: none; padding: 20px 28px 40px; }
  .tab-panel.active { display: block; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 18px; margin-bottom: 18px;
  }
  .control-group { display: flex; flex-direction: column; gap: 6px; }
  .control-group label.group-label { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .03em; }
  .checkbox-row, .radio-row { display: flex; gap: 12px; }
  .checkbox-row label, .radio-row label { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; }
  select {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
    font-size: 13px; min-width: 160px;
  }
  .panel-box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 18px; }
  .panel-title { font-size: 13px; font-weight: 600; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  tbody tr:hover { background: #f2f4f7; }
  tr.clickable-row { cursor: pointer; }
  .cell-pct { display: none; font-size: 10px; color: var(--muted); margin-top: 1px; }
  tr.expanded .cell-pct { display: block; }
  tr.expanded { background: var(--accent-soft); }
  .empty-state { color: var(--muted); padding: 24px; text-align: center; font-size: 13px; }
  .meta-banner {
    background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text);
    border-radius: 8px; padding: 10px 16px; margin: 0 28px 16px; font-size: 12.5px; line-height: 1.5;
  }
  .error-banner {
    background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b;
    border-radius: 8px; padding: 10px 16px; margin: 0 28px 16px; font-size: 12.5px; line-height: 1.5;
  }
  .error-banner .issue-warning { color: #9a3412; }
  .entity-list { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; min-width: 220px; }
  .entity-list label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 0; cursor: pointer; }
  svg text { font-family: inherit; }
  .axis-label { fill: var(--muted); font-size: 10.5px; }
  .bar-value { fill: var(--text); font-size: 10px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; }
  .table-filter {
    display: block; width: 100%; max-width: 320px; margin: 0 0 12px; padding: 6px 10px;
    border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--panel);
  }
  .totals-table-title { font-size: 12px; font-weight: 600; color: var(--muted); margin: 20px 0 8px; text-transform: uppercase; }
  .select-all-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .select-all-btn {
    font-size: 11px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--panel); color: var(--accent); cursor: pointer;
  }
  .select-all-btn:hover { background: var(--accent-soft); }
</style>
</head>
<body>

<header>
  <h1>Medvol Discount &amp; Sales Dashboard</h1>
  <div class="subtitle" id="generated-at"></div>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="counter">Discount Dispersion Tab</button>
  <button class="tab-btn" data-tab="division">Division Trend Tab</button>
  <button class="tab-btn" data-tab="np">NP Discounts Tab</button>
</div>

<div id="meta-banner-slot"></div>

<script type="application/json" id="report-data"></script>

<div class="tab-panel active" id="panel-counter">
  <div class="controls">
    <div class="control-group">
      <label class="group-label">Counter Age</label>
      <div class="checkbox-row">
        <label><input type="checkbox" id="age-old" checked> Old</label>
        <label><input type="checkbox" id="age-new"> New</label>
      </div>
    </div>
    <div class="control-group">
      <label class="group-label">Discount Filter</label>
      <div class="radio-row">
        <label><input type="radio" name="discount-type" value="ptr_only" checked> DiscountOnPTR only</label>
        <label><input type="radio" name="discount-type" value="total"> Total discount (PTR + Cash)</label>
      </div>
    </div>
    <div class="control-group">
      <label class="group-label">Group table by</label>
      <select id="counter-group-by">
        <option value="item_code">SKU</option>
        <option value="division">Division</option>
      </select>
    </div>
    <div class="control-group">
      <label class="group-label">Division (all checked by default)</label>
      <div class="select-all-row">
        <button type="button" class="select-all-btn" id="counter-division-select-all">Select all</button>
        <button type="button" class="select-all-btn" id="counter-division-select-none">Deselect all</button>
      </div>
      <div class="entity-list" id="counter-division-filter"></div>
    </div>
  </div>

  <div class="panel-box">
    <p class="panel-title">Sales by discount range</p>
    <div id="counter-bar-chart"></div>
  </div>

  <div class="panel-box">
    <p class="panel-title" id="counter-table-title">Sales by SKU x discount range</p>
    <input type="text" class="table-filter" id="counter-table-filter" placeholder="Filter by name or code...">
    <div id="counter-table"></div>
  </div>
</div>

<div class="tab-panel" id="panel-division">
  <div class="controls">
    <div class="control-group">
      <label class="group-label">Level</label>
      <select id="division-level">
        <option value="division">Division</option>
        <option value="brand">Brand</option>
        <option value="item_code">SKU</option>
      </select>
    </div>
    <div class="control-group">
      <label class="group-label">View by</label>
      <select id="division-period-mode">
        <option value="fy" selected>Financial Year (Apr–Mar)</option>
        <option value="month">Month</option>
      </select>
    </div>
    <div class="control-group">
      <label class="group-label">Metric</label>
      <div class="radio-row">
        <label><input type="radio" name="division-metric" value="medvol" checked> Medvol % (Amount / Gross)</label>
        <label><input type="radio" name="division-metric" value="net_sales"> Net Sales % (Invoice / Gross)</label>
      </div>
    </div>
    <div class="control-group">
      <label class="group-label">Entities shown (top 5 by sales, editable)</label>
      <div class="select-all-row">
        <button type="button" class="select-all-btn" id="division-entity-select-all">Select all</button>
        <button type="button" class="select-all-btn" id="division-entity-select-none">Deselect all</button>
      </div>
      <div class="entity-list" id="division-entity-list"></div>
    </div>
  </div>

  <div class="panel-box">
    <p class="panel-title" id="division-chart-title">% over time</p>
    <div id="division-line-chart"></div>
    <div class="legend" id="division-legend"></div>
    <p class="totals-table-title">Totals across the shown period (actual value + %)</p>
    <div id="division-totals-table"></div>
    <p class="totals-table-title">Breakdown by period (actual value + %)</p>
    <input type="text" class="table-filter" id="division-period-table-filter" placeholder="Filter by name...">
    <div id="division-period-table"></div>
  </div>
</div>

<div class="tab-panel" id="panel-np">
  <div class="controls">
    <div class="control-group">
      <label class="group-label">Discount Filter</label>
      <div class="radio-row">
        <label><input type="radio" name="np-discount-type" value="ptr_only" checked> DiscountOnPTR only</label>
        <label><input type="radio" name="np-discount-type" value="total"> Total discount (PTR + Cash)</label>
      </div>
    </div>
    <div class="control-group">
      <label class="group-label">Division (all checked by default)</label>
      <div class="select-all-row">
        <button type="button" class="select-all-btn" id="np-division-select-all">Select all</button>
        <button type="button" class="select-all-btn" id="np-division-select-none">Deselect all</button>
      </div>
      <div class="entity-list" id="np-division-filter"></div>
    </div>
  </div>

  <div class="panel-box">
    <p class="panel-title">New-product sales by discount range</p>
    <div id="np-bar-chart"></div>
  </div>

  <div class="panel-box">
    <p class="panel-title">New-product sales by SKU x discount range</p>
    <input type="text" class="table-filter" id="np-table-filter" placeholder="Filter by name or code...">
    <div id="np-table"></div>
  </div>
</div>

<script>
const LINE_COLORS = ['var(--line1)', 'var(--line2)', 'var(--line3)', 'var(--line4)', 'var(--line5)'];
const BUCKET_ORDER = ["<5%", "5-15%", "15-25%", "25-35%", "35-45%", "45-55%", "55-65%", "65-80%", ">80%"];
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const LEVEL_LABELS = { division: 'division', brand: 'brand', item_code: 'SKU' };

let REPORT = null;
let divisionPeriodRows = [];
let counterByEntity = {};
let counterGroupLabel = 'SKU';
let npByEntity = {};

const embedded = document.getElementById('report-data');
if (embedded && embedded.textContent.trim()) {
  REPORT = JSON.parse(embedded.textContent);
  init();
} else {
  fetch('./output/report_data.json')
    .then(r => r.json())
    .then(data => { REPORT = data; init(); })
    .catch(err => {
      document.body.innerHTML = '<div class="empty-state">No data embedded and could not load output/report_data.json — run scripts/build_report_data.py first.<br>' + err + '</div>';
    });
}

function init() {
  document.getElementById('generated-at').textContent = 'Generated ' + REPORT.meta.generated_at;
  renderMetaBanner();

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  ['age-old', 'age-new'].forEach(id => document.getElementById(id).addEventListener('change', renderCounterTab));
  document.querySelectorAll('input[name="discount-type"]').forEach(el => el.addEventListener('change', renderCounterTab));
  document.getElementById('counter-group-by').addEventListener('change', renderCounterTab);

  document.getElementById('division-level').addEventListener('change', () => { populateDivisionEntities(); renderDivisionTab(); });
  document.getElementById('division-period-mode').addEventListener('change', renderDivisionTab);
  document.querySelectorAll('input[name="division-metric"]').forEach(el => el.addEventListener('change', renderDivisionTab));

  document.querySelectorAll('input[name="np-discount-type"]').forEach(el => el.addEventListener('change', renderNpTab));

  document.getElementById('counter-table-filter').addEventListener('input', renderFilteredCounterTable);
  document.getElementById('np-table-filter').addEventListener('input', renderFilteredNpTable);
  document.getElementById('division-period-table-filter').addEventListener('input', renderFilteredDivisionPeriodTable);

  setUpSelectAll('counter-division-select-all', 'counter-division-select-none', '.counter-division-checkbox', renderCounterTab);
  setUpSelectAll('division-entity-select-all', 'division-entity-select-none', '.division-entity-checkbox', renderDivisionTab);
  setUpSelectAll('np-division-select-all', 'np-division-select-none', '.np-division-checkbox', renderNpTab);

  populateCounterDivisionFilter();
  renderCounterTab();
  populateDivisionEntities();
  renderDivisionTab();
  populateNpDivisionFilter();
  renderNpTab();
}

function setUpSelectAll(allBtnId, noneBtnId, checkboxSelector, onChange) {
  document.getElementById(allBtnId).addEventListener('click', () => {
    document.querySelectorAll(checkboxSelector).forEach(cb => cb.checked = true);
    onChange();
  });
  document.getElementById(noneBtnId).addEventListener('click', () => {
    document.querySelectorAll(checkboxSelector).forEach(cb => cb.checked = false);
    onChange();
  });
}

function renderMetaBanner() {
  const m = REPORT.meta;

  if (m.build_issues && m.build_issues.length) {
    const errors = m.build_issues.filter(i => i.severity === 'error');
    const warningsList = m.build_issues.filter(i => i.severity !== 'error');
    const el = document.createElement('div');
    el.className = 'error-banner';
    let html = '<strong>Internal codebase issues hit while building this report'
      + (errors.length ? ' (' + errors.length + ' likely mean some data is missing)' : '') + ':</strong><br>';
    errors.forEach(i => { html += '&bull; <strong>' + escapeHtml(i.message) + '</strong><br>'; });
    warningsList.forEach(i => { html += '&bull; <span class="issue-warning">' + escapeHtml(i.message) + '</span><br>'; });
    el.innerHTML = html;
    document.getElementById('meta-banner-slot').appendChild(el);
  }

  const notes = [];
  if (m.row_counts.unclassified > 0) {
    notes.push(m.row_counts.unclassified + ' row(s) had an unrecognized Order_Status (' + m.unclassified_statuses.join(', ') + ') — excluded from totals, shown here for visibility.');
  }
  if (m.files_skipped && m.files_skipped.length) {
    notes.push(m.files_skipped.length + ' file(s) in data/ were skipped (no parseable period, no file_periods.csv entry): ' + m.files_skipped.join(', '));
  }
  if (m.duplicate_rows_conflicting > 0) {
    notes.push(m.duplicate_rows_conflicting + ' order line(s) appear in multiple files with DIFFERENT values — kept all copies, needs manual review.');
  }
  if (!m.brand_master_file_present || m.valid_rows_with_unmapped_brand > 0) {
    notes.push(m.valid_rows_with_unmapped_brand + ' valid row(s) have no brand match yet (Unmapped) in brand_master.csv — Division tab brand-level views are partial until the full master list is loaded.');
  }
  if (!m.new_counters_file_present) {
    notes.push('No new-counters file yet — every counter is shown as "Old".');
  } else if (!m.counter_age_cutoff_date) {
    notes.push('New-counters file loaded, but no cutoff date is set (scripts/config.py: COUNTER_AGE_CUTOFF_DATE) — every counter is currently "Old". Edit that value and rerun the build script to split New/Old.');
  } else {
    notes.push(m.new_counter_valid_rows.toLocaleString() + ' valid row(s) classified "New" (cutoff: ' + m.counter_age_cutoff_date + '). Change the cutoff in scripts/config.py and rerun the build script to adjust.');
  }
  notes.push('NP Discounts tab: ' + m.new_product_sku_count + ' SKUs are on the new-products list; only those with real order data show up in the chart/table.');
  if (m.missing_month_ranges && m.missing_month_ranges.length) {
    const formatted = m.missing_month_ranges.map(formatMissingRange).join('; ');
    notes.push('<strong>No Division Trend data for:</strong> ' + formatted + ' (intended window: ' +
      monthDisplay(m.trend_window.start) + ' – ' + monthDisplay(m.trend_window.end) + ').');
  }
  if (!notes.length) return;
  const el = document.createElement('div');
  el.className = 'meta-banner';
  el.innerHTML = '<strong>Data notes:</strong><br>' + notes.map(n => '&bull; ' + n).join('<br>');
  document.getElementById('meta-banner-slot').appendChild(el);
}

// ---------- Counter tab ----------

function populateCounterDivisionFilter() {
  const divisions = Array.from(new Set(REPORT.counter_tab.map(r => r.division))).sort();
  const container = document.getElementById('counter-division-filter');
  container.innerHTML = divisions.map(d =>
    '<label><input type="checkbox" class="counter-division-checkbox" value="' + escapeHtml(d) + '" checked> ' + escapeHtml(d) + '</label>'
  ).join('');
  container.querySelectorAll('.counter-division-checkbox').forEach(cb => cb.addEventListener('change', renderCounterTab));
}

function getCounterFilters() {
  const ages = [];
  if (document.getElementById('age-old').checked) ages.push('Old');
  if (document.getElementById('age-new').checked) ages.push('New');
  const discountType = document.querySelector('input[name="discount-type"]:checked').value;
  const groupBy = document.getElementById('counter-group-by').value;
  const divisions = Array.from(document.querySelectorAll('.counter-division-checkbox:checked')).map(cb => cb.value);
  return { ages, discountType, groupBy, divisions };
}

function renderCounterTab() {
  const { ages, discountType, groupBy, divisions } = getCounterFilters();
  const rows = REPORT.counter_tab.filter(r =>
    ages.includes(r.counter_age) && r.discount_type === discountType
    && divisions.includes(r.division)
  );

  const bucketTotals = {};
  BUCKET_ORDER.forEach(b => bucketTotals[b] = 0);
  rows.forEach(r => { bucketTotals[r.bucket] = (bucketTotals[r.bucket] || 0) + r.amount; });
  renderBarChart(document.getElementById('counter-bar-chart'), BUCKET_ORDER, BUCKET_ORDER.map(b => bucketTotals[b]));

  counterGroupLabel = groupBy === 'division' ? 'Division' : 'SKU';
  document.getElementById('counter-table-title').textContent = 'Sales by ' + counterGroupLabel + ' x discount range';

  counterByEntity = {};
  rows.forEach(r => {
    const key = groupBy === 'division' ? r.division : (r.item_code + ' — ' + r.item_description);
    if (!counterByEntity[key]) counterByEntity[key] = { total: 0, buckets: {} };
    counterByEntity[key].buckets[r.bucket] = (counterByEntity[key].buckets[r.bucket] || 0) + r.amount;
    counterByEntity[key].total += r.amount;
  });
  renderFilteredCounterTable();
}

function renderFilteredCounterTable() {
  const filterText = document.getElementById('counter-table-filter').value.trim().toLowerCase();
  const filtered = Object.entries(counterByEntity).filter(([name]) => name.toLowerCase().includes(filterText));
  const sortedEntities = filtered.sort((a, b) => b[1].total - a[1].total).slice(0, 50);
  renderCounterTable(sortedEntities, counterGroupLabel);
}

function renderBucketTableRows(sortedEntities) {
  return sortedEntities.map(([name, data]) => {
    const cells = BUCKET_ORDER.map(b => {
      const v = data.buckets[b] || 0;
      const pct = data.total ? 100 * v / data.total : 0;
      return '<td><div class="cell-value">' + formatMoney(v) + '</div><div class="cell-pct">' + pct.toFixed(1) + '% of row total</div></td>';
    }).join('');
    return '<tr class="clickable-row" title="Click to show % of this row\'s total">' +
      '<td>' + escapeHtml(name) + '</td>' + cells +
      '<td><strong>' + formatMoney(data.total) + '</strong></td></tr>';
  }).join('');
}

function attachRowExpandToggle(container) {
  container.querySelectorAll('tbody tr.clickable-row').forEach(row => {
    row.addEventListener('click', () => row.classList.toggle('expanded'));
  });
}

function renderCounterTable(sortedEntities, groupLabel) {
  const container = document.getElementById('counter-table');
  if (!sortedEntities.length) {
    container.innerHTML = '<div class="empty-state">No data for this selection.</div>';
    return;
  }
  let html = '<table><thead><tr><th>' + groupLabel + '</th>' +
    BUCKET_ORDER.map(b => '<th>' + b + '</th>').join('') + '<th>Total</th></tr></thead><tbody>' +
    renderBucketTableRows(sortedEntities) + '</tbody></table>';
  if (sortedEntities.length === 50) html += '<div class="empty-state">Showing top 50 by total sales.</div>';
  container.innerHTML = html;
  attachRowExpandToggle(container);
}

// ---------- NP Discounts tab ----------

function populateNpDivisionFilter() {
  const divisions = Array.from(new Set(REPORT.np_discounts_tab.map(r => r.division))).sort();
  const container = document.getElementById('np-division-filter');
  container.innerHTML = divisions.map(d =>
    '<label><input type="checkbox" class="np-division-checkbox" value="' + escapeHtml(d) + '" checked> ' + escapeHtml(d) + '</label>'
  ).join('');
  container.querySelectorAll('.np-division-checkbox').forEach(cb => cb.addEventListener('change', renderNpTab));
}

function renderNpTab() {
  const discountType = document.querySelector('input[name="np-discount-type"]:checked').value;
  const divisions = Array.from(document.querySelectorAll('.np-division-checkbox:checked')).map(cb => cb.value);
  const rows = REPORT.np_discounts_tab.filter(r => r.discount_type === discountType && divisions.includes(r.division));

  const bucketTotals = {};
  BUCKET_ORDER.forEach(b => bucketTotals[b] = 0);
  rows.forEach(r => { bucketTotals[r.bucket] = (bucketTotals[r.bucket] || 0) + r.amount; });
  renderBarChart(document.getElementById('np-bar-chart'), BUCKET_ORDER, BUCKET_ORDER.map(b => bucketTotals[b]));

  npByEntity = {};
  rows.forEach(r => {
    const key = r.item_code + ' — ' + r.item_description;
    if (!npByEntity[key]) npByEntity[key] = { total: 0, buckets: {} };
    npByEntity[key].buckets[r.bucket] = (npByEntity[key].buckets[r.bucket] || 0) + r.amount;
    npByEntity[key].total += r.amount;
  });
  renderFilteredNpTable();
}

function renderFilteredNpTable() {
  const filterText = document.getElementById('np-table-filter').value.trim().toLowerCase();
  const filtered = Object.entries(npByEntity).filter(([name]) => name.toLowerCase().includes(filterText));
  const sortedEntities = filtered.sort((a, b) => b[1].total - a[1].total).slice(0, 50);
  renderNpTable(sortedEntities);
}

function renderNpTable(sortedEntities) {
  const container = document.getElementById('np-table');
  if (!sortedEntities.length) {
    container.innerHTML = '<div class="empty-state">No new-product sales for this selection yet.</div>';
    return;
  }
  let html = '<table><thead><tr><th>SKU</th>' +
    BUCKET_ORDER.map(b => '<th>' + b + '</th>').join('') + '<th>Total</th></tr></thead><tbody>' +
    renderBucketTableRows(sortedEntities) + '</tbody></table>';
  if (sortedEntities.length === 50) html += '<div class="empty-state">Showing top 50 by total sales.</div>';
  container.innerHTML = html;
  attachRowExpandToggle(container);
}

// ---------- Division tab ----------

function populateDivisionEntities() {
  const level = document.getElementById('division-level').value;
  const totals = {};
  REPORT.division_tab.forEach(r => {
    const key = r[level];
    totals[key] = (totals[key] || 0) + r.amount_sum;
  });
  const top5 = Object.entries(totals).sort((a, b) => b[1] - a[1]).slice(0, 5).map(e => e[0]);

  const container = document.getElementById('division-entity-list');
  const allKeys = Object.keys(totals).sort();
  container.innerHTML = allKeys.map(key =>
    '<label><input type="checkbox" class="division-entity-checkbox" value="' + escapeHtml(key) + '"' +
    (top5.includes(key) ? ' checked' : '') + '> ' + escapeHtml(key) + '</label>'
  ).join('');
  container.querySelectorAll('.division-entity-checkbox').forEach(cb => cb.addEventListener('change', renderDivisionTab));
}

function monthDisplay(monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  return MONTH_NAMES[m - 1] + ' ' + y;
}

function formatMissingRange(rangeStr) {
  const parts = rangeStr.split(' to ');
  if (parts.length === 1) return monthDisplay(parts[0]) + ' (' + fyLabel(parts[0]) + ')';
  return monthDisplay(parts[0]) + ' – ' + monthDisplay(parts[1]) + ' (' + fyLabel(parts[0]) + (fyLabel(parts[0]) !== fyLabel(parts[1]) ? '–' + fyLabel(parts[1]) : '') + ')';
}

function fyLabel(monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const fyEndYear = m >= 4 ? y + 1 : y;
  return 'FY' + String(fyEndYear).slice(-2);
}

function renderDivisionTab() {
  const level = document.getElementById('division-level').value;
  const periodMode = document.getElementById('division-period-mode').value;
  const metric = document.querySelector('input[name="division-metric"]:checked').value;
  const selected = Array.from(document.querySelectorAll('.division-entity-checkbox:checked')).map(cb => cb.value);

  const periodNoun = periodMode === 'fy' ? 'financial year' : 'month';
  document.getElementById('division-chart-title').textContent =
    (metric === 'medvol' ? 'Medvol %' : 'Net Sales %') + ' by ' + periodNoun + ', by ' + LEVEL_LABELS[level];

  // period (month or FY label) -> entity -> {num, den}
  const byPeriodEntity = {};
  REPORT.division_tab.forEach(r => {
    const key = r[level];
    if (!selected.includes(key)) return;
    const period = periodMode === 'fy' ? fyLabel(r.month) : r.month;
    if (!byPeriodEntity[period]) byPeriodEntity[period] = {};
    if (!byPeriodEntity[period][key]) byPeriodEntity[period][key] = { num: 0, den: 0 };
    const num = metric === 'medvol' ? r.amount_sum : r.invoice_amount_sum;
    byPeriodEntity[period][key].num += num;
    byPeriodEntity[period][key].den += r.gross_sales_sum;
  });

  const periods = Object.keys(byPeriodEntity).sort();
  const series = selected.map((key, i) => ({
    name: key,
    color: LINE_COLORS[i % LINE_COLORS.length],
    points: periods.map(p => {
      const cell = byPeriodEntity[p] && byPeriodEntity[p][key];
      if (!cell || cell.den === 0) return null;
      return { x: p, y: 100 * cell.num / cell.den };
    }),
  }));

  renderLineChart(document.getElementById('division-line-chart'), periods, series);

  const legend = document.getElementById('division-legend');
  legend.innerHTML = series.map(s =>
    '<div class="legend-item"><span class="legend-swatch" style="background:' + s.color + '"></span>' + escapeHtml(s.name) + '</div>'
  ).join('');

  renderDivisionTotalsTable(level, selected);
  renderDivisionPeriodTable(level, periodMode, selected);
}

function renderDivisionPeriodTable(level, periodMode, selected) {
  const byPeriodEntity = {};
  REPORT.division_tab.forEach(r => {
    const key = r[level];
    if (!selected.includes(key)) return;
    const period = periodMode === 'fy' ? fyLabel(r.month) : r.month;
    const cellKey = period + '|' + key;
    if (!byPeriodEntity[cellKey]) byPeriodEntity[cellKey] = { period, key, amount: 0, invoice: 0, gross: 0 };
    byPeriodEntity[cellKey].amount += r.amount_sum;
    byPeriodEntity[cellKey].invoice += r.invoice_amount_sum;
    byPeriodEntity[cellKey].gross += r.gross_sales_sum;
  });

  divisionPeriodRows = Object.values(byPeriodEntity).sort((a, b) =>
    a.period === b.period ? a.key.localeCompare(b.key) : a.period.localeCompare(b.period)
  );
  window._divisionPeriodLevel = level;
  renderFilteredDivisionPeriodTable();
}

function renderFilteredDivisionPeriodTable() {
  const level = window._divisionPeriodLevel || 'division';
  const filterText = document.getElementById('division-period-table-filter').value.trim().toLowerCase();
  const rows = divisionPeriodRows.filter(r => r.key.toLowerCase().includes(filterText));

  const container = document.getElementById('division-period-table');
  if (!rows.length) {
    container.innerHTML = '<div class="empty-state">No data for this selection.</div>';
    return;
  }
  const entityLabel = LEVEL_LABELS[level].charAt(0).toUpperCase() + LEVEL_LABELS[level].slice(1);
  let html = '<table><thead><tr><th>Period</th><th>' + entityLabel +
    '</th><th>Amount</th><th>Invoice Amount</th><th>Gross Sales</th><th>Medvol %</th><th>Net Sales %</th></tr></thead><tbody>';
  rows.forEach(r => {
    const medvolPct = r.gross ? 100 * r.amount / r.gross : 0;
    const netSalesPct = r.gross ? 100 * r.invoice / r.gross : 0;
    html += '<tr><td>' + r.period + '</td><td>' + escapeHtml(r.key) + '</td>' +
      '<td>' + formatMoney(r.amount) + '</td>' +
      '<td>' + formatMoney(r.invoice) + '</td>' +
      '<td>' + formatMoney(r.gross) + '</td>' +
      '<td>' + medvolPct.toFixed(1) + '%</td>' +
      '<td>' + netSalesPct.toFixed(1) + '%</td></tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function renderDivisionTotalsTable(level, selected) {
  const totals = {};
  REPORT.division_tab.forEach(r => {
    const key = r[level];
    if (!selected.includes(key)) return;
    if (!totals[key]) totals[key] = { amount: 0, invoice: 0, gross: 0 };
    totals[key].amount += r.amount_sum;
    totals[key].invoice += r.invoice_amount_sum;
    totals[key].gross += r.gross_sales_sum;
  });

  const container = document.getElementById('division-totals-table');
  const rows = selected.filter(key => totals[key]).sort((a, b) => totals[b].amount - totals[a].amount);
  if (!rows.length) {
    container.innerHTML = '<div class="empty-state">No data for this selection.</div>';
    return;
  }
  let html = '<table><thead><tr><th>' + (LEVEL_LABELS[level].charAt(0).toUpperCase() + LEVEL_LABELS[level].slice(1)) +
    '</th><th>Amount (Discounted Sales)</th><th>Invoice Amount</th><th>Gross Sales</th><th>Medvol %</th><th>Net Sales %</th></tr></thead><tbody>';
  rows.forEach(key => {
    const t = totals[key];
    const medvolPct = t.gross ? 100 * t.amount / t.gross : 0;
    const netSalesPct = t.gross ? 100 * t.invoice / t.gross : 0;
    html += '<tr><td>' + escapeHtml(key) + '</td>' +
      '<td>' + formatMoney(t.amount) + '</td>' +
      '<td>' + formatMoney(t.invoice) + '</td>' +
      '<td>' + formatMoney(t.gross) + '</td>' +
      '<td>' + medvolPct.toFixed(1) + '%</td>' +
      '<td>' + netSalesPct.toFixed(1) + '%</td></tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

// ---------- tiny SVG chart helpers ----------

function renderBarChart(container, categories, values) {
  if (!categories.length || values.every(v => v === 0)) {
    container.innerHTML = '<div class="empty-state">No data for this selection.</div>';
    return;
  }
  const width = 900, height = 260, padL = 60, padB = 60, padT = 16, padR = 16;
  const chartW = width - padL - padR, chartH = height - padT - padB;
  const maxVal = Math.max(...values, 1);
  const barW = chartW / categories.length;

  let bars = '';
  categories.forEach((cat, i) => {
    const v = values[i];
    const barH = (v / maxVal) * chartH;
    const x = padL + i * barW + barW * 0.15;
    const y = padT + chartH - barH;
    const w = barW * 0.7;
    bars += `<rect x="${x}" y="${y}" width="${w}" height="${barH}" fill="var(--bar)" rx="2"></rect>`;
    bars += `<text class="bar-value" x="${x + w / 2}" y="${y - 4}" text-anchor="middle">${formatMoneyShort(v)}</text>`;
    bars += `<text class="axis-label" x="${x + w / 2}" y="${height - padB + 16}" text-anchor="middle">${cat}</text>`;
  });

  container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;">
    <line x1="${padL}" y1="${padT + chartH}" x2="${width - padR}" y2="${padT + chartH}" stroke="var(--border)"></line>
    ${bars}
  </svg>`;
}

function renderLineChart(container, months, series) {
  const anyPoints = series.some(s => s.points.some(p => p !== null));
  if (!months.length || !anyPoints) {
    container.innerHTML = '<div class="empty-state">No data for this selection.</div>';
    return;
  }
  const width = 900, height = 300, padL = 50, padB = 50, padT = 16, padR = 16;
  const chartW = width - padL - padR, chartH = height - padT - padB;

  const allY = series.flatMap(s => s.points.filter(p => p !== null).map(p => p.y));
  const maxY = Math.max(...allY, 10) * 1.1;
  const minY = Math.min(0, ...allY);
  const xStep = months.length > 1 ? chartW / (months.length - 1) : 0;

  const xFor = i => padL + i * xStep;
  const yFor = v => padT + chartH - ((v - minY) / (maxY - minY || 1)) * chartH;

  let lines = '';
  series.forEach(s => {
    let d = '';
    s.points.forEach((p, i) => {
      if (p === null) return;
      const cmd = d === '' ? 'M' : 'L';
      d += `${cmd}${xFor(i)},${yFor(p.y)} `;
    });
    if (d) lines += `<path d="${d.trim()}" fill="none" stroke="${s.color}" stroke-width="2"></path>`;
    s.points.forEach((p, i) => {
      if (p === null) return;
      lines += `<circle cx="${xFor(i)}" cy="${yFor(p.y)}" r="2.5" fill="${s.color}"></circle>`;
    });
  });

  const labelEvery = Math.max(1, Math.ceil(months.length / 12));
  let xLabels = '';
  months.forEach((m, i) => {
    if (i % labelEvery !== 0) return;
    xLabels += `<text class="axis-label" x="${xFor(i)}" y="${height - padB + 16}" text-anchor="middle">${m}</text>`;
  });

  const gridLines = 4;
  let yGrid = '';
  for (let g = 0; g <= gridLines; g++) {
    const val = minY + (g / gridLines) * (maxY - minY);
    const y = yFor(val);
    yGrid += `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"></line>`;
    yGrid += `<text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${val.toFixed(0)}%</text>`;
  }

  container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;">
    ${yGrid}
    ${lines}
    ${xLabels}
  </svg>`;
}

function formatMoney(v) {
  return v.toLocaleString('en-IN', { maximumFractionDigits: 0 });
}
function formatMoneyShort(v) {
  if (v >= 100000) return (v / 100000).toFixed(1) + 'L';
  if (v >= 1000) return (v / 1000).toFixed(1) + 'k';
  return v.toFixed(0);
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
